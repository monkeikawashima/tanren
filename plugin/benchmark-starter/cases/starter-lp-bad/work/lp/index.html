<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box;margin:0;padding:0}body{width:1440px;height:900px;background:linear-gradient(160deg,#6d5dfc,#46c2ff);color:#fff;font-family:"Hiragino Sans",sans-serif;text-align:center;overflow:hidden}
header{display:flex;justify-content:space-between;padding:24px 48px;font-size:15px}
nav span{margin-left:24px}
h1{margin-top:90px;font-size:44px}
.sub{margin-top:14px;font-size:18px;opacity:.9}
.btn{display:inline-block;margin-top:32px;background:#fff;color:#5b4cff;border-radius:999px;padding:14px 40px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.cards{display:grid;grid-template-columns:repeat(3,300px);gap:32px;justify-content:center;margin-top:72px}
.card{background:rgba(255,255,255,.18);border-radius:16px;padding:28px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.card b{display:block;font-size:30px}
.card h3{margin-top:10px;font-size:18px}
.card p{margin-top:8px;font-size:14px;opacity:.9}</style></head>
<body><header><span>✨ kinome</span><nav><span>作品</span><span>工房について</span><span>お問い合わせ</span></nav></header>
<h1>暮らしに、長く使える木の道具を。</h1><p class="sub">一つひとつ手で削り、使うほどに色が深まる器と家具をつくっています。</p><span class="btn">作品を見る →</span>
<div class="cards"><div class="card"><b>🪵</b><h3>天然の木</h3><p>木のぬくもりを大切に</p></div><div class="card"><b>🛠️</b><h3>手づくり</h3><p>一つひとつ丁寧に</p></div><div class="card"><b>💎</b><h3>長く使える</h3><p>使うほどに味が出る</p></div></div></body></html>
