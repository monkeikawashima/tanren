<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}body{width:300px;height:250px;background:#f3f0e8;color:#141414;font-family:"Zen Kaku Gothic New",sans-serif;padding:20px 20px 18px;display:flex;flex-direction:column}
.label{font-size:11px;font-weight:500;letter-spacing:.12em}
h1{margin-top:22px;font-size:31px;font-weight:700;line-height:1.22;font-feature-settings:"palt";letter-spacing:.01em}
.rule{margin-top:18px;width:28px;height:3px;background:#e2452b}
.meta{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between}
.date{font-size:26px;font-weight:700;letter-spacing:.02em;line-height:1}
.date small{font-size:13px;font-weight:500;margin-left:6px}
.place{font-size:12px;font-weight:500}</style></head>
<body><p class="label">社内勉強会</p><h1>デザインと<br>AI の現在地</h1><div class="rule"></div>
<div class="meta"><p class="date">11.20<small>19:00</small></p><p class="place">オンライン</p></div></body></html>
