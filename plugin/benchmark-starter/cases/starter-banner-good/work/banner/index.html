<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<!-- 題の「現在地」を、地図の格子と現在地のマーカーで見せる。文字の段階は 12/16/21/28/37（比率 1.33） -->
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f3f0e8;--ink:#141414;--grid:#e2ddd1;--pin:#d83b22;--sub:#4a4740}
body{width:300px;height:250px;background:var(--paper);color:var(--ink);font-family:"Inter","Zen Kaku Gothic New",sans-serif;padding:20px;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-position:-1px -1px;box-shadow:inset 0 0 0 1px #d8d2c4}
.label{font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--sub)}
h1{margin-top:16px;font-size:37px;font-weight:700;line-height:1.2;font-feature-settings:"palt";letter-spacing:0;word-break:auto-phrase}
h1 .lat{margin-right:.08em}
.pin{display:inline-block;position:relative;width:12px;height:12px;margin-left:10px;vertical-align:.32em}
.pin::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--pin);box-shadow:0 0 0 3px var(--paper)}
.pin::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid var(--pin);opacity:.55}
.meta{margin-top:auto;display:flex;align-items:baseline;gap:8px}
.date{font-size:28px;font-weight:700;letter-spacing:.01em;line-height:1}
.time{font-size:21px;font-weight:500;line-height:1}
.place{margin-left:auto;font-size:16px;font-weight:700;line-height:1}</style></head>
<body><p class="label">社内勉強会</p>
<h1>デザインと<br><span class="lat">AI</span>の現在地<span class="pin" aria-hidden="true"></span></h1>
<div class="meta"><p class="date">11.20</p><p class="time">19:00</p><p class="place">オンライン</p></div></body></html>
