<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}body{width:1440px;height:900px;background:#efe9e0;color:#2a2521;font-family:"Zen Kaku Gothic New",sans-serif;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:36px 72px}
.logo{font-family:"Shippori Mincho B1",serif;font-size:24px;font-weight:700;letter-spacing:.06em}
nav{display:flex;gap:40px;font-size:14px;font-weight:500;letter-spacing:.06em}
main{display:grid;grid-template-columns:1fr 600px;gap:96px;padding:56px 72px 0 120px;align-items:start}
h1{font-family:"Shippori Mincho B1",serif;font-weight:500;font-size:64px;line-height:1.38;letter-spacing:.04em;font-feature-settings:"palt";margin-top:64px}
.lead{margin-top:40px;max-width:22em;word-break:auto-phrase;font-size:16px;line-height:1.95;letter-spacing:.04em}
.cta{margin-top:56px;display:flex;gap:32px;align-items:center}
.btn{background:#2a2521;color:#efe9e0;padding:18px 40px;font-size:15px;font-weight:500;letter-spacing:.08em}
.link{font-size:15px;font-weight:500;letter-spacing:.06em;border-bottom:1px solid #2a2521;padding-bottom:4px}
.img{height:640px;background:#cdbfae;display:flex;align-items:flex-end;padding:20px;font-size:12px;color:#463c34;letter-spacing:.06em}</style></head>
<body><header><p class="logo">kinome</p><nav><span>作品</span><span>工房について</span><span>お問い合わせ</span></nav></header>
<main><div><h1>暮らしに、<br>長く使える<br>木の道具を。</h1><p class="lead">一つひとつ手で削り、使うほどに色が深まる器と家具をつくっています。</p>
<div class="cta"><span class="btn">作品を見る</span></div></div><div class="img">画像：工房の作業台と削りかけの器</div></main></body></html>
