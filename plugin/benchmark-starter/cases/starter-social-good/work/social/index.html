<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@500&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}body{width:1080px;height:1080px;background:#f4efe4;color:#1f2b24;font-family:"Zen Kaku Gothic New",sans-serif;padding:96px;position:relative;overflow:hidden}
.kicker{font-size:30px;font-weight:500;letter-spacing:.2em}
h1{margin-top:24px;font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:200px;line-height:1.08;letter-spacing:.02em;font-feature-settings:"palt"}
.date{position:absolute;left:96px;bottom:150px;font-size:120px;font-weight:500;line-height:1;color:#c2563a;letter-spacing:.02em}
.date small{font-size:44px;margin-left:16px;color:#1f2b24}
.place{position:absolute;left:96px;bottom:92px;font-size:30px;font-weight:500;letter-spacing:.08em}
.frame{position:absolute;inset:0;overflow:hidden}
.leaf{position:absolute;right:-120px;top:120px;width:420px;height:420px;border-radius:50%;background:#dfe6d6}</style></head>
<body><div class="frame"><div class="leaf"></div></div><h1 style="position:relative">春の<br>読書会</h1><p class="date">4.12<small>14:00</small></p><p class="place">市立図書館 2F</p></body></html>
