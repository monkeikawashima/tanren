<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&display=swap">
<!-- 読書会なので、題を本の背のように縦に組み、上から垂らした桜色の栞の先に日時を置く。書体は明朝1系統、差し色は栞と日付で1色。文字の段階は 56/78/110/154（比率 1.4） -->
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f4efe4;--ink:#1f2b24;--accent:#c25f6a;--line:#d9d1bf}
body{width:1080px;height:1080px;background:var(--paper);color:var(--ink);font-family:"Shippori Mincho B1",serif;position:relative;overflow:hidden}
/* 本の背：右に縦組みの題 */
.spine{position:absolute;top:96px;right:72px;bottom:96px;width:248px;display:flex;justify-content:flex-end}
h1{writing-mode:vertical-rl;font-weight:700;font-size:154px;line-height:1.3;letter-spacing:.04em;font-feature-settings:"vpal"}
/* 頁：綴じ目から左へ、縦組みの行を思わせる細い罫を引く。綴じ目・罫・栞は同じ y=712 で止め、日時には重ねない */
.page{position:absolute;left:96px;top:96px;width:664px;height:616px;background:repeating-linear-gradient(270deg,var(--line) 0 1px,transparent 1px 64px);opacity:.8}
.gutter{position:absolute;left:759px;top:96px;width:2px;height:616px;background:var(--line)}
/* 栞：上の縁から垂らし、先を燕尾に切って日時を指す */
.ribbon{position:absolute;left:96px;top:0;width:56px;height:712px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 28px),0 100%)}
.info{position:absolute;left:96px;bottom:96px}
.date{display:flex;align-items:baseline;gap:24px;line-height:1}
.date .d{font-size:110px;font-weight:700;color:var(--accent);letter-spacing:0}
.date .t{font-size:78px;font-weight:500}
.place{margin-top:32px;font-size:56px;font-weight:500;letter-spacing:.04em;line-height:1.2}
.place .lat{margin-left:.15em}</style></head>
<body><div class="page" aria-hidden="true"></div><div class="gutter" aria-hidden="true"></div><div class="ribbon" aria-hidden="true"></div>
<div class="spine"><h1>春の読書会</h1></div>
<div class="info"><p class="date"><span class="d">4.12</span><span class="t">14:00</span></p><p class="place">市立図書館<span class="lat">2F</span></p></div></body></html>
